name: E2E Tests (3C3D)

on:
  push:
    branches: [ main, dev/* ]
  pull_request:
    branches: [ main ]

jobs:
  e2e-3c3d:
    name: E2E Test with 3 ConfigNodes and 3 DataNodes
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run E2E tests with Docker Compose
        run: |
          docker compose -f docker-compose-3c3d.yml up --build --abort-on-container-exit --exit-code-from iotdb-test

      - name: Clean up
        if: always()
        run: |
          docker compose -f docker-compose-3c3d.yml down -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-3c3d
          path: |
            coverage/
            *.log
