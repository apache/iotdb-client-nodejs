services:
  iotdb-test:
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile
    depends_on:
      iotdb-datanode-1:
        condition: service_healthy
      iotdb-datanode-2:
        condition: service_healthy
      iotdb-datanode-3:
        condition: service_healthy
    environment:
      - IOTDB_HOST=iotdb-datanode-1
      - IOTDB_PORT=6667
      - IOTDB_USER=root
      - IOTDB_PASSWORD=root
    networks:
      - iotdb-network
    command: sh -c "sleep 60 && npm run test:e2e"

  # ConfigNode 1
  iotdb-confignode-1:
    image: apache/iotdb:2.0.6-confignode
    container_name: iotdb-confignode-1
    restart: always
    healthcheck:
      test: ["CMD", "ls", "/iotdb/data"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - iotdb-network
    environment:
      - cn_internal_address=iotdb-confignode-1
      - cn_internal_port=10710
      - cn_seed_config_node=iotdb-confignode-1:10710
      - schema_replication_factor=3
      - data_replication_factor=3
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M

  # ConfigNode 2
  iotdb-confignode-2:
    image: apache/iotdb:2.0.6-confignode
    container_name: iotdb-confignode-2
    restart: always
    healthcheck:
      test: ["CMD", "ls", "/iotdb/data"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      iotdb-confignode-1:
        condition: service_healthy
    networks:
      - iotdb-network
    environment:
      - cn_internal_address=iotdb-confignode-2
      - cn_internal_port=10710
      - cn_seed_config_node=iotdb-confignode-1:10710
      - schema_replication_factor=3
      - data_replication_factor=3
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M

  # ConfigNode 3
  iotdb-confignode-3:
    image: apache/iotdb:2.0.6-confignode
    container_name: iotdb-confignode-3
    restart: always
    healthcheck:
      test: ["CMD", "ls", "/iotdb/data"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      iotdb-confignode-1:
        condition: service_healthy
      iotdb-confignode-2:
        condition: service_healthy
    networks:
      - iotdb-network
    environment:
      - cn_internal_address=iotdb-confignode-3
      - cn_internal_port=10710
      - cn_seed_config_node=iotdb-confignode-1:10710
      - schema_replication_factor=3
      - data_replication_factor=3
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M

  # DataNode 1
  iotdb-datanode-1:
    image: apache/iotdb:2.0.6-datanode
    container_name: iotdb-datanode-1
    restart: always
    healthcheck:
      test: ["CMD", "ls", "/iotdb/data/datanode/system"]
      interval: 10s
      timeout: 60s
      retries: 30
      start_period: 30s
    depends_on:
      iotdb-confignode-1:
        condition: service_healthy
    ports:
      - "6667:6667"
    networks:
      - iotdb-network
    environment:
      - dn_rpc_address=iotdb-datanode-1
      - dn_internal_address=iotdb-datanode-1
      - dn_seed_config_node=iotdb-confignode-1:10710
      - dn_rpc_port=6667
      - schema_replication_factor=3
      - data_replication_factor=3
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M

  # DataNode 2
  iotdb-datanode-2:
    image: apache/iotdb:2.0.6-datanode
    container_name: iotdb-datanode-2
    restart: always
    healthcheck:
      test: ["CMD", "ls", "/iotdb/data/datanode/system"]
      interval: 10s
      timeout: 60s
      retries: 30
      start_period: 30s
    depends_on:
      iotdb-confignode-1:
        condition: service_healthy
      iotdb-confignode-2:
        condition: service_healthy
    ports:
      - "6668:6667"
    networks:
      - iotdb-network
    environment:
      - dn_rpc_address=iotdb-datanode-2
      - dn_internal_address=iotdb-datanode-2
      - dn_seed_config_node=iotdb-confignode-1:10710
      - dn_rpc_port=6667
      - schema_replication_factor=3
      - data_replication_factor=3
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M

  # DataNode 3
  iotdb-datanode-3:
    image: apache/iotdb:2.0.6-datanode
    container_name: iotdb-datanode-3
    restart: always
    healthcheck:
      test: ["CMD", "ls", "/iotdb/data/datanode/system"]
      interval: 10s
      timeout: 60s
      retries: 30
      start_period: 30s
    depends_on:
      iotdb-confignode-1:
        condition: service_healthy
      iotdb-confignode-2:
        condition: service_healthy
      iotdb-confignode-3:
        condition: service_healthy
    ports:
      - "6669:6667"
    networks:
      - iotdb-network
    environment:
      - dn_rpc_address=iotdb-datanode-3
      - dn_internal_address=iotdb-datanode-3
      - dn_seed_config_node=iotdb-confignode-1:10710
      - dn_rpc_port=6667
      - schema_replication_factor=3
      - data_replication_factor=3
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M

networks:
  iotdb-network:
    driver: bridge
